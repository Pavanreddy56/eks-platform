apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.17.1
    helm:
      valuesObject:
        clusterName: eks-platform-dev
        region: ap-south-1
        # Pods cannot reach instance metadata (hop limit 1), so the
        # controller finds the VPC by its Name tag instead.
        vpcTags:
          Name: eks-platform-dev
        serviceAccount:
          create: true
          name: aws-load-balancer-controller   # bound to an IAM role via EKS Pod Identity
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
