# Values for the one-time Argo CD install (scripts/bootstrap-argocd.sh).
# After this, Argo CD manages everything else from Git.

dex:
  enabled: false            # local admin login is enough for a demo
notifications:
  enabled: false

configs:
  cm:
    # Report child Application health so sync waves in the app-of-apps wait
    # for platform add-ons (CRDs, controllers) before deploying workloads.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

server:
  service:
    type: ClusterIP         # access via kubectl port-forward
