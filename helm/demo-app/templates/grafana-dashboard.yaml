{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-app.fullname" . }}-dashboard
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  demo-app.json: |-
{{ .Files.Get "dashboards/demo-app.json" | indent 4 }}
{{- end }}
