{{- if .Values.database.enabled }}
# Namespaced SecretStore: authenticates with the External Secrets Operator's
# own EKS Pod Identity role, which can read only this environment's secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "demo-app.fullname" . }}-aws
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.database.awsRegion }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "demo-app.fullname" . }}-db
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "demo-app.fullname" . }}-aws
  target:
    name: {{ include "demo-app.fullname" . }}-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.database.remoteSecretName }}
{{- end }}
